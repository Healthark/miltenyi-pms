[pytest]
# Run pytest from the `backend/` directory:
#   cd backend && pytest
#
# `testpaths = tests` keeps discovery focused on our suite (avoids the
# .venv site-packages walk that produced thousands of false-positive
# matches in earlier ad-hoc runs).
#
# `pythonpath = .` makes `from main import app` work from anywhere in
# the tests/ tree — `main.py` lives directly under backend/, which is
# already CWD when pytest runs.
testpaths = tests
pythonpath = .

# Suppress the deprecation warning chatter from third-party libs (jose,
# passlib) so test output stays readable. Filter shape: warnings from
# our own code still surface.
filterwarnings =
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:passlib.*
